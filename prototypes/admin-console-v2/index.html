<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>벨로르 운영 관리자</title>
  <link rel="stylesheet" href="./admin-auth.css?v=20260826-admin-release-v5">
  <link rel="stylesheet" href="./admin-console.css?v=20260826-admin-simple-v1">
  <link rel="stylesheet" href="./features/workspace/admin-wanted.css">
  <link rel="stylesheet" href="./features/mypage-editor/admin-mypage-editor.css?v=20260826-admin-simple-v1">
  <link rel="stylesheet" href="./features/home-editor/admin-home-editor.css?v=20260827-home-block-editor-v1">
  <link rel="stylesheet" href="./features/home-editor/admin-home-layout-editor.css?v=20260828-home-layout-editor-v1">
  <link rel="stylesheet" href="./features/operations/admin-operations.css?v=20260826-catalog-ledger-v3">
</head>
<body>
  <main class="admin-auth" id="adminAuth" aria-labelledby="adminAuthTitle">
    <section class="admin-auth-card">
      <a class="admin-auth-brand" href="/" aria-label="벨로르 홈">
        <img src="/assets/logo-bellore.png" alt="BELLORE KOREA">
      </a>
      <div class="admin-auth-copy">
        <span>운영자 전용</span>
        <h1 id="adminAuthTitle">관리자 로그인</h1>
        <p>등록된 운영 계정으로 로그인해 주세요.</p>
      </div>
      <form id="adminLoginForm" method="post" action="/admin/" novalidate>
        <label><span>아이디</span><input id="adminLoginId" name="username" autocomplete="username" required></label>
        <label><span>비밀번호</span><input id="adminLoginPassword" name="password" type="password" autocomplete="current-password" required></label>
        <label class="admin-auth-remember">
          <input id="adminRememberLogin" type="checkbox" checked>
          <span>자동 로그인<small>이 기기에서 관리자 로그인을 유지합니다.</small></span>
        </label>
        <p class="admin-auth-error" id="adminAuthError" role="alert" hidden></p>
        <button id="adminLoginButton" type="submit">로그인</button>
      </form>
      <a class="admin-auth-home" href="/">벨로르 홈으로</a>
    </section>
  </main>

  <div class="admin-app" id="adminApp" hidden>
    <header class="admin-topbar">
      <div class="brand-cluster">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <a class="brand" href="./" aria-label="벨로르 운영 홈">
          <img src="../../assets/logo-bellore.png" alt="BELLORE KOREA">
        </a>
        <span class="admin-surface-title">운영 관리자</span>
      </div>

      <label class="global-search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="globalSearch" type="search" placeholder="주문번호, 견적번호, 상품, 고객, 업체 검색" autocomplete="off">
        <kbd>Ctrl/⌘ K</kbd>
      </label>

      <div class="topbar-actions">
        <span class="prototype-badge">운영 관리자</span>
        <button class="icon-button" type="button" aria-label="알림">
          <span class="bell-icon" aria-hidden="true"></span><i>3</i>
        </button>
        <button class="admin-profile" type="button">
          <span class="avatar" id="adminProfileInitial">벨</span>
          <span><b id="adminProfileName">벨로르 관리자</b><small>관리자</small></span>
          <span aria-hidden="true">⌄</span>
        </button>
        <button class="admin-logout" id="adminLogout" type="button">로그아웃</button>
      </div>
    </header>

    <div class="admin-frame">
      <aside class="admin-sidebar" id="adminSidebar" aria-label="관리자 메뉴">
        <div class="sidebar-scroll">
          <nav id="adminNav"></nav>
        </div>
        <div class="sidebar-foot">
          <div class="system-state">
            <span class="state-dot"></span>
            <span><b>관리자 권한 확인됨</b><small>운영 계정 전용 화면</small></span>
          </div>
        </div>
      </aside>

      <main class="admin-main" id="adminWorkspace" tabindex="-1"></main>
    </div>

    <div class="mobile-scrim" id="mobileScrim" hidden></div>
    <aside class="case-drawer" id="caseDrawer" aria-label="업무 상세" aria-hidden="true">
      <div id="caseDrawerContent"></div>
    </aside>
    <div class="drawer-scrim" id="drawerScrim" hidden></div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  </div>

  <script type="module" src="./bootstrap.js?v=20260831-mypage-admin-contract-v1"></script>
</body>
</html>
