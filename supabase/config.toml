project_id = "bellore"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[functions.create-checkout]
verify_jwt = true

[functions.confirm-payment]
verify_jwt = true

[functions.cancel-payment]
verify_jwt = true

[functions.verify-identity]
verify_jwt = true

[functions.sync-email-verification]
verify_jwt = true

[functions.complete-otp-signup]
verify_jwt = true

[functions.verify-business]
verify_jwt = true

[functions.verify-account]
verify_jwt = true

[functions.admin-manage-verification]
verify_jwt = true

[functions.admin-member-ops]
verify_jwt = true

[functions.admin-audit-events]
verify_jwt = true

# PortOne notifications carry no Supabase user JWT. The handler treats the body
# only as a hint and re-fetches the payment with the server-side PortOne secret.
[functions.payment-webhook]
verify_jwt = false

[functions.reconcile-payments]
verify_jwt = false
