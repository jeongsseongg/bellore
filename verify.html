<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>벨로르 · Supabase 연동 점검</title>
<link rel="stylesheet" href="tools/verify-browser.css">
</head>
<body>
  <h1>벨로르 · Supabase 연동 점검</h1>
  <p class="muted">이 페이지는 운영 배포에 포함되지 않는 로컬 전용 진단 도구입니다. 저장소에서 직접 열거나 로컬 HTTP 서버로 실행해 연동·로그인 상태를 점검합니다.</p>

  <h2>1) 연동 점검 (자동)</h2>
  <div id="c-config" class="row run"><span class="dot"></span><span>설정 로드</span></div>
  <div id="c-sdk" class="row run"><span class="dot"></span><span>supabase-js SDK 로드</span></div>
  <div id="c-client" class="row run"><span class="dot"></span><span>클라이언트 생성</span></div>
  <div id="c-read" class="row run"><span class="dot"></span><span>테이블 읽기 (listings)</span></div>
  <div id="c-tables" class="row run"><span class="dot"></span><span>전체 테이블 확인</span></div>

  <h2>2) 로그인 점검</h2>
  <fieldset>
    <legend>이메일/비밀번호 로그인 (관리자 계정으로 테스트하세요)</legend>
    <div class="verify-controls">
      <input id="email" class="verify-email" type="email" placeholder="이메일">
      <input id="pw" class="verify-password" type="password" placeholder="비밀번호">
      <button id="btnLogin">로그인</button>
      <button id="btnLogout" class="verify-logout">로그아웃</button>
    </div>
    <div id="c-auth" class="row verify-auth-row"><span class="dot"></span><span>로그인 상태: 로그아웃됨</span></div>
  </fieldset>

  <h2>결과 로그</h2>
  <pre id="log"></pre>

  <!-- 실제 사이트와 동일한 설정/SDK 사용 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script defer src="tools/verify-browser.js"></script>
</body>
</html>
