name: Deploy to Firebase Hosting

# main에 푸시될 때마다 보조 Firebase Hosting(newyork-watch/live)으로 자동 배포합니다.
# bellore.co.kr의 주 운영 경로는 GitHub Pages이며 Firebase와 혼동하지 않습니다.
# 필요한 GitHub Secret: FIREBASE_SERVICE_ACCOUNT
#   (Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성 으로 받은 JSON 전체)
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 상품/글이 추가·품절돼도 자동 반영되도록 하루 1회 재생성 후 재배포.
  # (버전 누적으로 인한 호스팅 저장용량 초과를 막기 위해 6시간→1일로 축소)
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST

# GITHUB_TOKEN 권한 최소화(공급망/탈취 대비). 배포에는 읽기 권한이면 충분.
permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  truth_guard:
    uses: ./.github/workflows/truth-guard.yml

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED != 'false'
    needs: truth_guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      # 로컬·PR·두 운영 배포가 같은 한 줄 게이트를 사용한다.
      - name: Project release gate
        run: node scripts/check.mjs

      - name: Supabase Edge locked typecheck
        run: node scripts/check-edge.mjs

      - name: Build clean Firebase artifact
        run: node tools/build-pages.mjs

      - name: Verify final Firebase artifact
        run: node scripts/test-pages-artifact.mjs --site _site --expect-seo

      # 배포 직전 옛 호스팅 버전 정리 → 저장용량 확보(429 RESOURCE_EXHAUSTED 방지).
      # 실패해도 배포는 계속 시도한다.
      - name: Prune old Hosting versions (free storage)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/prune-hosting.mjs

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0 peeled commit, node24
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: newyork-watch
          channelId: live
