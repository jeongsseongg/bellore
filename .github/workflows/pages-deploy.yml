name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      static_release_sha:
        description: 'main을 포함하는 잠금형 운영 릴리스 SHA'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  truth_guard:
    uses: ./.github/workflows/truth-guard.yml

  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.PRODUCTION_DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.static_release_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.static_release_sha || github.sha }}

      - name: Validate static frontend release source
        if: github.event_name == 'workflow_dispatch' && inputs.static_release_sha != ''
        shell: bash
        env:
          STATIC_RELEASE_SHA: ${{ inputs.static_release_sha }}
          WORKFLOW_MAIN_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$STATIC_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'static_release_sha must be a full lowercase commit SHA.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$STATIC_RELEASE_SHA" ]]; then
            echo 'Checked-out commit does not match static_release_sha.' >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/codex/locked-pages-release
          if [[ "$(git rev-parse FETCH_HEAD)" != "$STATIC_RELEASE_SHA" ]]; then
            echo 'static_release_sha must equal the locked release branch head.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WORKFLOW_MAIN_SHA" "$STATIC_RELEASE_SHA"; then
            echo 'Locked release must contain the exact workflow main revision.' >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: Reject obsolete preview or release base
        run: python scripts/check-preview-deploy-base.py --check-current

      # 로컬·PR·두 운영 배포가 같은 한 줄 게이트를 사용한다.
      - name: Project release gate
        run: node scripts/check.mjs

      - name: Supabase Edge locked typecheck
        run: node scripts/check-edge.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build clean Pages artifact
        run: node tools/build-pages.mjs

      - name: Verify final Pages artifact
        run: node scripts/test-pages-artifact.mjs --site _site --expect-seo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.PRODUCTION_DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.static_release_sha != ''))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [truth_guard, build]
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
