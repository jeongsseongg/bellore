name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Project quality check
        run: node scripts/check.mjs

      - name: Verify market SEO generator
        run: node scripts/test-seo-market.mjs

      - name: Verify clean Pages allowlist
        run: node scripts/test-pages-artifact.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build clean Pages artifact
        run: node tools/build-pages.mjs

      - name: Verify final Pages artifact
        run: node scripts/test-pages-artifact.mjs --site _site --expect-seo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
