name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  truth_guard:
    uses: ./.github/workflows/truth-guard.yml

  build:
    if: >-
      (github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED != 'false') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/home-algorithm-release')
    needs: truth_guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Project quality check
        run: node scripts/check.mjs

      - name: Verify market SEO generator
        run: node scripts/test-seo-market.mjs

      - name: Verify clean Pages allowlist
        run: node scripts/test-pages-artifact.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build clean Pages artifact
        run: node tools/build-pages.mjs

      - name: Verify final Pages artifact
        run: node scripts/test-pages-artifact.mjs --site _site --expect-seo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: >-
      (github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED != 'false') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/home-algorithm-release')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [truth_guard, build]
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
