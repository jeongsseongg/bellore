name: Project Quality Check

# PR과 main에 로컬과 같은 릴리스 게이트 결과를 만든다. Pages/Firebase 배포도
# 각 workflow에서 같은 명령을 다시 실행하므로 실패한 산출물은 게시하지 않는다.
# 직접 push·merge 자체를 막는 required check/ruleset은 별도 원격 설정이다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'
      - name: Project release gate
        run: node scripts/check.mjs
      - name: Supabase Edge locked typecheck
        run: node scripts/check-edge.mjs
