                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%coupon_user_id is not null%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%payment_contract_version = 2%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%status%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%failed%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%canceled%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%refunded%'
            ) or not exists (
              select 1
                from pg_index as x
                join pg_class as i on i.oid=x.indexrelid
               where i.relname='orders_checkout_request_key_hash_uidx'
                 and x.indrelid='public.orders'::regclass
                 and x.indisunique and x.indpred is not null
                 and pg_get_indexdef(x.indexrelid,1,true)='checkout_request_key_hash'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%checkout_request_key_hash is not null%'
            ) then
              raise exception 'v2 unresolved claim indexes verification failed';
            end if;
            if not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_guard_new_checkout_claims_v1'
                 and tgfoid=to_regprocedure('public.guard_new_checkout_claims_v1()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or not exists (
              select 1 from pg_trigger
               where tgrelid='public.listings'::regclass
                 and tgname='trg_guard_listing_reservation_owner_v1'
                 and tgfoid=to_regprocedure('public.guard_listing_reservation_owner_v1()')
                 and tgenabled <> 'D' and not tgisinternal
            ) then
              raise exception 'checkout claim integrity trigger verification failed';
            end if;
            if not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_guard_order_money_fields'
                 and tgfoid=to_regprocedure('public.guard_order_money_fields()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or has_function_privilege('authenticated',
              'public.guard_order_money_fields()','execute')
               or position('payment_contract_version'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('checkout_request_key_hash'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('restock_required'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('payment_review_required'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('payment_terminal_at'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('new.order_no is distinct from old.order_no'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('old.status in'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('new.status = ''paid'''
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0 then
              raise exception 'order financial state guard verification failed';
            end if;
            if position('set_config(''app.payment_contract_version'', ''2'', true)'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('set_config(''app.checkout_request_key_hash'', p_checkout_request_key_hash, true)'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('pg_advisory_xact_lock'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('checkout_request_conflict'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('''checkoutReplayed'', true'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('p_expected_amount'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('checkout_amount_changed'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('''reservationMode'',''provider_terminal'''
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0
               or position('''paymentContractVersion'',2'
                 in pg_get_functiondef('public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)'::regprocedure))=0 then
              raise exception 'provider-terminal checkout wrapper verification failed';
            end if;
          end $$;
          SQL
          echo "운영 권한·결제 ACL 사후 검증 완료"

      - name: Verify checkout rate limit across concurrent DB sessions
        if: inputs.task == 'apply-authority-payment' || inputs.task == 'verify-authority-payment-live'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RATE_KEY="$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -d' ' -f1)"
          result_dir="$(mktemp -d)"
          cleanup_rate() {
            docker run --rm -e PGCONN postgres:17 \
              psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
              -c "delete from public.checkout_rate_limits where key_hash='$RATE_KEY'" \
              >/dev/null
            rm -rf "$result_dir"
          }
          trap cleanup_rate EXIT

          pids=()
          for attempt in $(seq 1 10); do
            (
              if docker run --rm -e PGCONN \
                postgres:17 psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
                -c "set role service_role; set request.jwt.claims = '{\"role\":\"service_role\"}'; select public.consume_checkout_rate_limit('$RATE_KEY')" \
                >"$result_dir/$attempt.out" 2>"$result_dir/$attempt.err"; then
                : >"$result_dir/$attempt.ok"
              elif grep -q 'checkout_rate_limited' "$result_dir/$attempt.err"; then
                : >"$result_dir/$attempt.limited"
              else
                : >"$result_dir/$attempt.unexpected"
              fi
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

          success_count="$(find "$result_dir" -name '*.ok' -type f | wc -l | tr -d ' ')"
          limited_count="$(find "$result_dir" -name '*.limited' -type f | wc -l | tr -d ' ')"
          unexpected_count="$(find "$result_dir" -name '*.unexpected' -type f | wc -l | tr -d ' ')"
          if [ "$success_count" != 5 ] || [ "$limited_count" != 5 ] || [ "$unexpected_count" != 0 ]; then
            echo "Concurrent rate test failed: allowed=$success_count limited=$limited_count unexpected=$unexpected_count"
            for marker in "$result_dir"/*.unexpected; do
              [ -e "$marker" ] || continue
              err_file="${marker%.unexpected}.err"
              if grep -q 'checkout_rate_forbidden' "$err_file"; then
                echo "unexpected category: role-claim"
              elif grep -qi 'permission denied' "$err_file"; then
                echo "unexpected category: permission"
              elif grep -qi 'too many clients\|remaining connection slots' "$err_file"; then
                echo "unexpected category: connection-limit"
              elif grep -qi 'could not connect\|connection refused\|timeout' "$err_file"; then
                echo "unexpected category: connection"
              else
                echo "unexpected category: other"
              fi
            done | sort | uniq -c
            exit 1
          fi
          stored_count="$(docker run --rm -e PGCONN postgres:17 \
            psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select attempt_count from public.checkout_rate_limits where key_hash='$RATE_KEY'")"
          test "$stored_count" = 5
          echo "Concurrent checkout rate limit verified: allowed=5 limited=5 stored=5"

