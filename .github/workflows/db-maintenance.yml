                 'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('anon','public.consume_checkout_rate_limit(text)','execute')
               or has_function_privilege('authenticated','public.consume_checkout_rate_limit(text)','execute')
               or not has_function_privilege('service_role',
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or not has_function_privilege('service_role',
                 'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or not has_function_privilege('service_role','public.consume_checkout_rate_limit(text)','execute')
               or has_function_privilege('authenticated',
                 'public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)','execute')
               or has_function_privilege('authenticated',
