               or not has_function_privilege('service_role',
                 'public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)','execute')
               or not has_function_privilege('service_role',
                 'public.finalize_order_refund_v2(text,bigint,text,text)','execute') then
              raise exception 'authority_payment_acl_fingerprint_mismatch';
            end if;

            -- Any unique object from the target release means somebody applied
            -- part of it outside this atomic workflow. Stop; never layer over it.
            if to_regclass('public.payment_operation_controls') is not null
               or to_regclass('public.payment_operation_holds') is not null
               or to_regclass('public.payment_reconciliation_orders_edge_v1') is not null
