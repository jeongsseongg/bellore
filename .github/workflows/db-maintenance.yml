               or position('checkout_rate_limited' in lower(pg_get_functiondef(
                 'public.consume_checkout_rate_limit(text)'::regprocedure)))=0 then
              raise exception 'checkout_rate_limiter_body_fingerprint_mismatch';
            end if;
            if has_table_privilege('anon','public.orders','insert')
               or has_table_privilege('authenticated','public.orders','insert')
               or not has_table_privilege('service_role','public.orders','select')
               or has_table_privilege('anon','public.checkout_rate_limits','select')
               or has_table_privilege('anon','public.checkout_rate_limits','insert')
               or has_table_privilege('anon','public.checkout_rate_limits','update')
