            if to_regprocedure('public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)') is not null
               or to_regprocedure('public.create_checkout_order_edge_v1(text,uuid,uuid,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)') is not null
               or has_table_privilege('anon','public.orders','insert')
               or has_table_privilege('authenticated','public.orders','insert')
