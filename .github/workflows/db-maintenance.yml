            end if;
            if to_regprocedure('public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)') is not null
               or to_regprocedure('public.create_checkout_order_edge_v1(text,uuid,uuid,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)') is not null then
              raise exception 'obsolete non-idempotent checkout wrapper still exists';
            end if;
            if has_table_privilege('anon','public.orders','insert')
               or has_table_privilege('authenticated','public.orders','insert') then
              raise exception 'orders direct insert is still open';
            end if;
            if has_function_privilege('anon','public._claim_coupon(public.coupons,uuid)','execute')
               or has_function_privilege('authenticated','public._claim_coupon(public.coupons,uuid)','execute') then
              raise exception 'internal coupon helper is still public';
            end if;
            if has_function_privilege('anon',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('authenticated',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('anon',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('authenticated',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('anon',
              'public.consume_checkout_rate_limit(text)','execute')
               or has_function_privilege('authenticated',
              'public.consume_checkout_rate_limit(text)','execute') then
              raise exception 'browser role bypasses checkout Edge gate';
            end if;
            if not has_function_privilege('service_role',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or not has_function_privilege('service_role',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,text,bigint,uuid,text,text,text,text,text,text,text,text,jsonb)','execute') then
              raise exception 'checkout RPC is not executable by service role';
            end if;
            if not has_function_privilege('service_role',
              'public.consume_checkout_rate_limit(text)','execute') then
              raise exception 'checkout rate limiter is not executable by service role';
            end if;
            if not exists (
              select 1
                from information_schema.columns
               where table_schema='public' and table_name='orders'
                 and column_name='payment_contract_version'
                 and data_type='smallint' and is_nullable='YES'
            ) then
              raise exception 'orders.payment_contract_version column contract missing';
            end if;
            if not exists (
              select 1
                from information_schema.columns
               where table_schema='public' and table_name='orders'
                 and column_name='checkout_request_key_hash'
                 and data_type='text' and is_nullable='YES'
            ) then
              raise exception 'orders.checkout_request_key_hash column contract missing';
            end if;
            if not exists (
              select 1
                from information_schema.columns
               where table_schema='public' and table_name='orders'
                 and column_name='restock_required'
                 and data_type='boolean' and is_nullable='NO'
                 and column_default='false'
            ) or not exists (
              select 1
                from information_schema.columns
               where table_schema='public' and table_name='orders'
                 and column_name='payment_review_required'
                 and data_type='boolean' and is_nullable='NO'
                 and column_default='false'
            ) then
              raise exception 'orders physical-restock/payment-review flag contract missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
               where table_schema='public' and table_name='orders'
                 and column_name='payment_terminal_at'
                 and data_type='timestamp with time zone' and is_nullable='YES'
            ) or exists (
              select 1 from public.orders
               where payment_contract_version=2
                 and status in ('failed','canceled')
                 and payment_terminal_at is null
            ) or not exists (
              select 1 from pg_constraint
               where conrelid='public.orders'::regclass
                 and conname='orders_v2_terminal_timestamp_required'
                 and contype='c' and convalidated
            ) or not exists (
              select 1 from pg_index as x
              join pg_class as i on i.oid=x.indexrelid
               where x.indrelid='public.orders'::regclass
                 and i.relname='orders_recent_payment_terminal_v2_idx'
                 and x.indpred is not null
                 and pg_get_indexdef(x.indexrelid,1,true)='payment_terminal_at'
                 and pg_get_indexdef(x.indexrelid,2,true)='id'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%payment_contract_version = 2%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%failed%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%canceled%'
            ) or not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_stamp_order_payment_terminal_at_v1'
                 and tgfoid=to_regprocedure('public.stamp_order_payment_terminal_at_v1()')
                 and tgenabled <> 'D' and not tgisinternal
            ) then
              raise exception 'payment terminal timestamp contract missing';
            end if;
            if not exists (
              select 1
                from pg_constraint as c
                join pg_class as t on t.oid=c.conrelid
                join pg_namespace as n on n.oid=t.relnamespace
               where n.nspname='public' and t.relname='orders'
                 and c.conname='orders_payment_contract_version_allowed'
                 and c.contype='c' and c.convalidated
                 and lower(pg_get_constraintdef(c.oid)) like '%payment_contract_version is null%'
                 and lower(pg_get_constraintdef(c.oid)) like '%payment_contract_version = 2%'
            ) then
              raise exception 'payment contract version check missing or unvalidated';
            end if;
            if not exists (
              select 1
                from pg_constraint as c
                join pg_class as t on t.oid=c.conrelid
                join pg_namespace as n on n.oid=t.relnamespace
               where n.nspname='public' and t.relname='orders'
                 and c.conname='orders_checkout_request_key_hash_format'
                 and c.contype='c' and c.convalidated
                 and lower(pg_get_constraintdef(c.oid)) like '%checkout_request_key_hash%'
                 and lower(pg_get_constraintdef(c.oid)) like '%[0-9a-f]{64}%'
            ) then
              raise exception 'checkout request hash format check missing or unvalidated';
            end if;
            if not exists (
              select 1
                from pg_index as x
                join pg_class as i on i.oid=x.indexrelid
                join pg_class as t on t.oid=x.indrelid
                join pg_namespace as n on n.oid=t.relnamespace
               where n.nspname='public' and t.relname='orders'
                 and i.relname='orders_one_unresolved_listing_v2_idx'
                 and x.indisunique and x.indpred is not null
                 and pg_get_indexdef(x.indexrelid,1,true)='listing_id'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%payment_contract_version = 2%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%status%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%failed%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%canceled%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%refunded%'
            ) then
              raise exception 'v2 unresolved listing unique index contract missing';
            end if;
            if not exists (
              select 1
                from pg_index as x
                join pg_class as i on i.oid=x.indexrelid
                join pg_class as t on t.oid=x.indrelid
                join pg_namespace as n on n.oid=t.relnamespace
               where n.nspname='public' and t.relname='orders'
                 and i.relname='orders_one_unresolved_coupon_idx'
                 and x.indisunique and x.indpred is not null
                 and pg_get_indexdef(x.indexrelid,1,true)='coupon_user_id'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%coupon_user_id is not null%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%payment_contract_version = 2%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%status%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%failed%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%canceled%'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%refunded%'
            ) then
              raise exception 'v2 unresolved coupon unique index contract missing';
            end if;
            if not exists (
              select 1
                from pg_index as x
                join pg_class as i on i.oid=x.indexrelid
                join pg_class as t on t.oid=x.indrelid
                join pg_namespace as n on n.oid=t.relnamespace
               where n.nspname='public' and t.relname='orders'
                 and i.relname='orders_checkout_request_key_hash_uidx'
                 and x.indisunique and x.indpred is not null
                 and pg_get_indexdef(x.indexrelid,1,true)='checkout_request_key_hash'
                 and lower(pg_get_expr(x.indpred,x.indrelid)) like '%checkout_request_key_hash is not null%'
            ) then
              raise exception 'checkout request idempotency unique index missing';
            end if;
            if not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_guard_new_checkout_claims_v1'
                 and tgfoid=to_regprocedure('public.guard_new_checkout_claims_v1()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or not exists (
              select 1 from pg_trigger
               where tgrelid='public.listings'::regclass
                 and tgname='trg_guard_listing_reservation_owner_v1'
                 and tgfoid=to_regprocedure('public.guard_listing_reservation_owner_v1()')
                 and tgenabled <> 'D' and not tgisinternal
            ) then
              raise exception 'checkout claim integrity trigger contract missing';
            end if;
            if not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_guard_order_money_fields'
                 and tgfoid=to_regprocedure('public.guard_order_money_fields()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or has_function_privilege('authenticated',
              'public.guard_order_money_fields()','execute')
               or position('payment_contract_version'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('checkout_request_key_hash'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('restock_required'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('payment_review_required'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('payment_terminal_at'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('new.order_no is distinct from old.order_no'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('old.status in'
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0
               or position('new.status = ''paid'''
                 in pg_get_functiondef('public.guard_order_money_fields()'::regprocedure))=0 then
              raise exception 'order financial state guard contract missing';
            end if;
            if has_function_privilege('authenticated',
              'public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)','execute') then
              raise exception 'payment finalizer leaked to browser role';
            end if;
            if to_regprocedure('public.clear_confirmed_payment_review_v1(text,text,bigint)') is null
               or to_regprocedure('public.order_requires_restock_v1(uuid,smallint,text,boolean,timestamptz,timestamptz,timestamptz)') is null then
              raise exception 'payment review/restock evidence RPC contract missing';
            end if;
            if has_function_privilege('anon',
              'public.clear_confirmed_payment_review_v1(text,text,bigint)','execute')
               or has_function_privilege('authenticated',
              'public.clear_confirmed_payment_review_v1(text,text,bigint)','execute')
               or not has_function_privilege('service_role',
              'public.clear_confirmed_payment_review_v1(text,text,bigint)','execute')
               or has_function_privilege('authenticated',
              'public.order_requires_restock_v1(uuid,smallint,text,boolean,timestamptz,timestamptz,timestamptz)','execute')
               or not has_function_privilege('service_role',
              'public.order_requires_restock_v1(uuid,smallint,text,boolean,timestamptz,timestamptz,timestamptz)','execute') then
              raise exception 'payment review/restock evidence RPC ACL failed';
            end if;
            if not exists (
              select 1 from pg_policies
               where schemaname='storage' and tablename='objects'
                 and policyname='photos_auth_delete'
                 and qual like '%owner_id%'
            ) then
              raise exception 'storage ownership policy missing';
            end if;
          end $$;

          -- Schema-only cloning intentionally copies no production rows.
          -- Seed only the six local listings required by behavioral fixtures.
          set local session_replication_role=replica;
          insert into public.listings (
            id,owner_id,title,description,price,category,status,image_url,image_urls
          )
          select gen_random_uuid(),
                 '00000000-0000-4000-8000-000000000001'::uuid,
                 '검증 전용 상품 ' || n::text,
                 '운영 데이터가 아닌 일회성 rollback fixture',
                 (1000000 + n * 10000)::numeric,
                 '검증', 'on_sale',
                 'validation-only-' || n::text,
                 array['validation-only-' || n::text]
            from generate_series(1,6) as n;
          set local session_replication_role=origin;

          -- orders_flow.sql is older, separately installed project SQL. Verify
          -- that a deployment without its optional history table can still run
          -- the pre-fulfilment cancellation decision without relation errors.
          do $$
          declare
            v_test_id uuid := gen_random_uuid();
          begin
            if to_regclass('public.order_status_history') is not null then
              if to_regclass('public._payment_guard_history_test') is not null then
                raise exception 'temporary history validation table already exists';
              end if;
              execute 'alter table public.order_status_history rename to _payment_guard_history_test';
              if public.order_requires_restock_v1(
                v_test_id, 2, 'cancel_req', false, null, null, null
              ) then
                raise exception 'missing history invented a post-fulfilment hold';
              end if;
              execute 'alter table public._payment_guard_history_test rename to order_status_history';
            end if;
          exception when others then
            if to_regclass('public.order_status_history') is null
               and to_regclass('public._payment_guard_history_test') is not null then
              execute 'alter table public._payment_guard_history_test rename to order_status_history';
            end if;
            raise;
          end $$;

          select l.id as listing_id,
                 (priced.true_price + case when priced.true_price >= 5000000 then 35000 else 0 end)::bigint
                   as expected_amount
            from public.listings as l
            cross join lateral (
              select case
                when 'sale'=any(coalesce(l.tags,'{}'::text[]))
                 and l.sale_price is not null and l.sale_price > 0
                 and l.sale_price < trunc(coalesce(l.price,0))::bigint
                 and coalesce(l.sale_started_at,l.created_at) + interval '72 hours' > now()
                  then l.sale_price::bigint
                else trunc(coalesce(l.price,0))::bigint
              end as true_price
            ) as priced
           where l.status='on_sale' and l.sold_order_id is null
             and (l.reserved_order_id is null or l.reserved_until <= now())
             and priced.true_price > 0
           order by l.id limit 1 \gset
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.create_checkout_order_edge_v1(
            p_rate_key => repeat('a',64),
            p_customer_id => null,
            p_listing_id => :'listing_id'::uuid,
            p_checkout_request_key_hash => repeat('1',64),
            p_checkout_token_hash => repeat('b',64),
            p_expected_amount => :'expected_amount'::bigint,
            p_buyer_name => '검증 구매자',
            p_buyer_phone => '01000000000',
            p_ship_recipient => '검증 수령인',
            p_ship_phone => '01000000000',
            p_ship_postcode => '00000',
            p_ship_addr1 => '검증 주소'
          ) as checkout_contract \gset
          select (
            :'checkout_contract'::jsonb->>'reservationMode'='provider_terminal'
            and (:'checkout_contract'::jsonb->>'paymentContractVersion')::integer=2
            and (:'checkout_contract'::jsonb->>'checkoutReplayed')::boolean=false
            and not (:'checkout_contract'::jsonb ? 'expiresAt')
          ) as checkout_contract_ok \gset
          \if :checkout_contract_ok
            \echo 'provider-terminal checkout contract verified'
          \else
            \echo 'provider-terminal checkout contract verification failed'
            \quit 1
          \endif
          select public.create_checkout_order_edge_v1(
            p_rate_key => repeat('a',64),
            p_customer_id => null,
            p_listing_id => :'listing_id'::uuid,
            p_checkout_request_key_hash => repeat('1',64),
            p_checkout_token_hash => repeat('b',64),
            p_expected_amount => :'expected_amount'::bigint,
            p_buyer_name => '검증 구매자',
            p_buyer_phone => '01000000000',
            p_ship_recipient => '검증 수령인',
            p_ship_phone => '01000000000',
            p_ship_postcode => '00000',
            p_ship_addr1 => '검증 주소'
          ) as checkout_retry \gset
          select (
            :'checkout_retry'::jsonb->>'orderNo'=:'checkout_contract'::jsonb->>'orderNo'
            and (:'checkout_retry'::jsonb->>'checkoutReplayed')::boolean=true
            and (select attempt_count from public.checkout_rate_limits where key_hash=repeat('a',64))=1
            and (select count(*) from public.orders where checkout_request_key_hash=repeat('1',64))=1
          ) as checkout_retry_ok \gset
          \if :checkout_retry_ok
            \echo 'checkout response-loss retry reused one order and one rate attempt'
          \else
            \echo 'checkout response-loss retry idempotency failed'
            \quit 1
          \endif
          select public.create_checkout_order_edge_v1(
            p_rate_key => repeat('a',64),
            p_customer_id => null,
            p_listing_id => :'listing_id'::uuid,
            p_checkout_request_key_hash => repeat('1',64),
            p_checkout_token_hash => repeat('b',64),
            p_expected_amount => :'expected_amount'::bigint,
            p_buyer_name => '검증 구매자',
            p_buyer_phone => '01000000000',
            p_ship_recipient => '검증 수령인',
            p_ship_phone => '01000000000',
            p_ship_postcode => '00000',
            p_ship_addr1 => '변조된 재시도 주소'
          ) as checkout_conflict \gset
          select (
            :'checkout_conflict'::jsonb->>'error'='checkout_request_conflict'
            and (select attempt_count from public.checkout_rate_limits where key_hash=repeat('a',64))=1
            and (select count(*) from public.orders where checkout_request_key_hash=repeat('1',64))=1
          ) as checkout_conflict_ok \gset
          \if :checkout_conflict_ok
            \echo 'checkout request-key mismatch failed closed without another rate attempt'
          \else
            \echo 'checkout request-key mismatch contract failed'
            \quit 1
          \endif
          select order_no, amount
            from public.orders
           where checkout_token_hash=repeat('b',64)
             and checkout_request_key_hash=repeat('1',64)
           order by created_at desc limit 1 \gset
          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and payment_contract_version=2
               and checkout_request_key_hash=repeat('1',64)
          ) as payment_contract_row_ok \gset
          \if :payment_contract_row_ok
            \echo 'payment contract version 2 row verified'
          \else
            \echo 'payment contract version 2 row verification failed'
            \quit 1
          \endif
          reset role;
          set local request.jwt.claims = '{"role":"authenticated"}';
          select set_config('app.guard_test_order_no', :'order_no', true);
          do $$
          declare v_order_no text := current_setting('app.guard_test_order_no');
          begin
            begin
              update public.orders set status='shipping' where order_no=v_order_no;
              raise exception 'pending order escaped provider verification';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set amount=amount+1 where order_no=v_order_no;
              raise exception 'order amount guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set payment_contract_version=null where order_no=v_order_no;
              raise exception 'payment contract version guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set checkout_request_key_hash=repeat('0',64) where order_no=v_order_no;
              raise exception 'checkout request identity guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set restock_required=true where order_no=v_order_no;
              raise exception 'restock flag guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set payment_review_required=true where order_no=v_order_no;
              raise exception 'payment review flag guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set payment_terminal_at=now() where order_no=v_order_no;
              raise exception 'payment terminal timestamp guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
            begin
              update public.orders set order_no=order_no || 'X' where order_no=v_order_no;
              raise exception 'order identity guard did not block';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
          end $$;
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.finalize_paid_order_v2(
            :'order_no', :'amount'::bigint, 'CARD', :'order_no', 'dry-run-tx', null, null, 0
          );
          select public.finalize_paid_order_v2(
            :'order_no', :'amount'::bigint, 'CARD', :'order_no', 'dry-run-tx', null, null, 0
          );
          update public.orders
             set payment_review_required=true
           where order_no=:'order_no';
          select public.clear_confirmed_payment_review_v1(
            :'order_no', :'order_no', :'amount'::bigint + 1
          ) as mismatched_review_clear \gset
          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and payment_review_required
          ) as mismatched_review_preserved \gset
          \if :mismatched_review_clear
            \echo 'mismatched provider value cleared payment review'
            \quit 1
          \endif
          \if :mismatched_review_preserved
          \else
            \echo 'mismatched provider value changed payment review state'
            \quit 1
          \endif
          select public.clear_confirmed_payment_review_v1(
            :'order_no', :'order_no', :'amount'::bigint
          ) as exact_review_clear \gset
          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and not payment_review_required
          ) as exact_review_cleared \gset
          \if :exact_review_clear
          \else
            \echo 'exact confirmed provider payment did not clear review'
            \quit 1
          \endif
          \if :exact_review_cleared
          \else
            \echo 'exact confirmed provider payment left review flag set'
            \quit 1
          \endif
          reset role;
          set local request.jwt.claims = '{"role":"authenticated"}';
          update public.orders set status='delivered' where order_no=:'order_no';
          update public.orders set status='cancel_req' where order_no=:'order_no';
          do $$
          declare v_order_no text := current_setting('app.guard_test_order_no');
          begin
            begin
              update public.orders set status='refunded' where order_no=v_order_no;
              raise exception 'operational order entered financial state directly';
            exception when others then
              if sqlerrm not like '%payment_fields_are_server_owned%' then raise; end if;
            end;
          end $$;
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.mark_order_payment_review(
            :'order_no', 'dry-run-partial-cancel-review'
          );
          do $$
          declare v_order_no text := current_setting('app.guard_test_order_no');
          begin
            if not exists (
              select 1 from public.orders
               where order_no=v_order_no and status='cancel_req'
                 and payment_review_required
            ) then
              raise exception 'partial cancellation review overwrote fulfillment lifecycle';
            end if;
          end $$;
          select public.mark_order_refund_pending(
            :'order_no', 'cancellation_intent:administrator_provider_verified_refund'
          ) as refund_pending_marked \gset
          \if :refund_pending_marked
          \else
            \echo 'delivered cancellation was not marked refund_pending'
            \quit 1
          \endif
          set constraints all immediate;
          set constraints all deferred;
          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and status='refund_pending'
               and restock_required and delivered_at is not null
          ) and exists (
            select 1
              from public.listings as l
              join public.orders as o on o.id=l.sold_order_id
             where l.id=:'listing_id'::uuid and l.status='sold'
               and o.order_no=:'order_no'
          ) as delivered_cancel_hold_ok \gset
          \if :delivered_cancel_hold_ok
            \echo 'delivered to cancel-request physical hold verified'
          \else
            \echo 'delivered cancellation lost durable restock evidence'
            \quit 1
          \endif
          select public.finalize_order_refund_v2(
            :'order_no', :'amount'::bigint, 'dry-run', 'dry-run-cancel'
          );
          select public.finalize_order_refund_v2(
            :'order_no', :'amount'::bigint, 'dry-run', 'dry-run-cancel'
          );
          reset role;

          -- Execute the deferred listing normalizer before observing the final
          -- state, otherwise a rollback-only test could miss its failure.
          set constraints all immediate;
          set constraints all deferred;

          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and status='refunded'
               and refund_amount=:'amount'::bigint
               and restock_required and not payment_review_required
          ) and exists (
            select 1
              from public.listings as l
              join public.orders as o on o.id=l.sold_order_id
             where l.id=:'listing_id'::uuid and l.status='sold'
               and o.order_no=:'order_no'
          ) as lifecycle_ok \gset
          \if :lifecycle_ok
            \echo 'post-fulfilment refund physical hold verified'
          \else
            \echo 'post-fulfilment refund released listing before inspection'
            \quit 1
          \endif

          -- Simulate the explicit server-owned operator action after return
          -- intake and inspection, then free this rollback fixture for the
          -- remaining checkout tests.
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.complete_order_restock_v1(:'order_no') as restock_completed \gset
          set constraints all immediate;
          set constraints all deferred;
          reset role;
          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and status='refunded'
               and not restock_required
          ) and exists (
            select 1 from public.listings
             where id=:'listing_id'::uuid and status='on_sale'
               and sold_order_id is null and reserved_order_id is null
          ) as post_inspection_reopen_ok \gset
          \if :restock_completed
          \else
            \echo 'post-inspection restock RPC rejected valid fixture'
            \quit 1
          \endif
          \if :post_inspection_reopen_ok
            \echo 'post-inspection listing reopen verified'
          \else
            \echo 'post-inspection listing reopen verification failed'
            \quit 1
          \endif

          -- A paid but not-yet-shipped cancellation must still release the
          -- listing after a full provider refund; it has no physical hold.
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.create_checkout_order_edge_v1(
            p_rate_key => repeat('d',64), p_customer_id => null,
            p_listing_id => :'listing_id'::uuid,
            p_checkout_request_key_hash => repeat('4',64),
            p_checkout_token_hash => repeat('5',64),
            p_expected_amount => :'expected_amount'::bigint,
            p_buyer_name => '발송 전 취소 검증', p_buyer_phone => '01000000000',
            p_ship_recipient => '발송 전 취소 수령인', p_ship_phone => '01000000000',
            p_ship_postcode => '00000', p_ship_addr1 => '발송 전 취소 주소'
          );
          select order_no, amount from public.orders
           where checkout_request_key_hash=repeat('4',64) \gset pre_
          select public.finalize_paid_order_v2(
            :'pre_order_no', :'pre_amount'::bigint, 'CARD', :'pre_order_no',
            'dry-run-pre-cancel', null, null, 0
          );
          update public.orders set status='cancel_req' where order_no=:'pre_order_no';
          select public.mark_order_refund_pending(
            :'pre_order_no', 'cancellation_intent:administrator_provider_verified_refund'
          );
          select public.finalize_order_refund_v2(
            :'pre_order_no', :'pre_amount'::bigint, 'dry-run-pre-cancel', 'dry-run-pre-refund'
          );
          set constraints all immediate;
          set constraints all deferred;
          select exists (
            select 1 from public.orders
             where order_no=:'pre_order_no' and status='refunded'
               and not restock_required
          ) and exists (
            select 1 from public.listings
             where id=:'listing_id'::uuid and status='on_sale'
               and sold_order_id is null and reserved_order_id is null
          ) as pre_fulfilment_release_ok \gset
          \if :pre_fulfilment_release_ok
            \echo 'pre-fulfilment cancellation release verified'
          \else
            \echo 'pre-fulfilment cancellation was incorrectly held'
            \quit 1
          \endif

          -- Reproduce the stale Edge-snapshot race entirely inside the rollback
          -- transaction. A provider PAID result obtained before this local
          -- close must not revive either a failed or a canceled order.
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.create_checkout_order_edge_v1(
            p_rate_key => repeat('8',64),
            p_customer_id => null,
            p_listing_id => :'listing_id'::uuid,
            p_checkout_request_key_hash => repeat('2',64),
            p_checkout_token_hash => repeat('7',64),
            p_expected_amount => :'expected_amount'::bigint,
            p_buyer_name => '닫힌 주문 검증 구매자',
            p_buyer_phone => '01000000000',
            p_ship_recipient => '닫힌 주문 검증 수령인',
            p_ship_phone => '01000000000',
            p_ship_postcode => '00000',
            p_ship_addr1 => '닫힌 주문 검증 주소'
          );
          select order_no, amount
            from public.orders
           where checkout_token_hash=repeat('7',64)
           order by created_at desc limit 1 \gset closed_
          select set_config('app.closed_finalize_test_order_no', :'closed_order_no', true);
          select set_config('app.closed_finalize_test_amount', :'closed_amount', true);
          select (payment_terminal_at is null) as pending_terminal_time_clear
            from public.orders where order_no=:'closed_order_no' \gset
          \if :pending_terminal_time_clear
          \else
            \echo 'pending order received a payment terminal timestamp'
            \quit 1
          \endif
          update public.orders set status='failed' where order_no=:'closed_order_no';
          do $$
          declare
            v_order_no text := current_setting('app.closed_finalize_test_order_no');
            v_amount bigint := current_setting('app.closed_finalize_test_amount')::bigint;
            v_terminal_at timestamptz;
          begin
            select payment_terminal_at into v_terminal_at
              from public.orders where order_no=v_order_no;
            if v_terminal_at is null then
              raise exception 'failed transition did not stamp payment terminal time';
            end if;
            begin
              perform public.finalize_paid_order_v2(
                v_order_no, v_amount, 'CARD', v_order_no,
                'dry-run-stale-failed', null, null, 0
              );
              raise exception 'failed order was revived by paid finalization';
            exception when sqlstate 'P0001' then
              if sqlerrm <> 'order_closed_before_paid_finalization' then raise; end if;
            end;

            update public.orders set status='canceled' where order_no=v_order_no;
            if (select payment_terminal_at from public.orders where order_no=v_order_no)
               is distinct from v_terminal_at then
              raise exception 'canceled rewrite changed first payment terminal time';
            end if;
            begin
              perform public.finalize_paid_order_v2(
                v_order_no, v_amount, 'CARD', v_order_no,
                'dry-run-stale-canceled', null, null, 0
              );
              raise exception 'canceled order was revived by paid finalization';
            exception when sqlstate 'P0001' then
              if sqlerrm <> 'order_closed_before_paid_finalization' then raise; end if;
            end;

            if not exists (
              select 1 from public.orders
               where order_no=v_order_no and status='canceled'
                 and payment_key is null and provider_transaction_id is null
                 and paid_at is null and payment_terminal_at is not null
            ) then
              raise exception 'closed order changed despite paid-finalization rejection';
            end if;
          end $$;
          -- Release the closed fixture before the next checkout test, then put
          -- deferred constraints back into their production transaction mode.
          set constraints all immediate;
          set constraints all deferred;
          do $$
          declare v_order_no text := current_setting('app.closed_finalize_test_order_no');
          begin
            if exists (
              select 1
                from public.listings as l
                join public.orders as o on o.listing_id=l.id
               where o.order_no=v_order_no
                 and (l.reserved_order_id=o.id or l.sold_order_id=o.id)
            ) then
              raise exception 'closed paid-finalization fixture retained listing ownership';
            end if;
          end $$;

          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select set_config('app.amount_test_listing_id', :'listing_id', true);
          select set_config('app.amount_test_expected', :'expected_amount', true);
          do $$
          declare
            v_listing uuid := current_setting('app.amount_test_listing_id')::uuid;
            v_expected bigint := current_setting('app.amount_test_expected')::bigint;
            v_result jsonb;
          begin
            v_result := public.create_checkout_order_edge_v1(
              p_rate_key => repeat('f',64),
              p_customer_id => null,
              p_listing_id => v_listing,
              p_checkout_request_key_hash => repeat('3',64),
              p_checkout_token_hash => repeat('9',64),
              p_expected_amount => v_expected + 1,
              p_buyer_name => '금액 변경 검증 구매자',
              p_buyer_phone => '01000000000',
              p_ship_recipient => '금액 변경 검증 수령인',
              p_ship_phone => '01000000000',
              p_ship_postcode => '00000',
              p_ship_addr1 => '금액 변경 검증 주소'
            );
            if v_result->>'error' <> 'checkout_amount_changed' then
              raise exception 'checkout amount mismatch did not return its safe error';
            end if;
            if exists (
              select 1 from public.orders where checkout_token_hash=repeat('9',64)
            ) or exists (
              select 1 from public.listings
               where id=v_listing
                 and (reserved_order_id is not null or reserved_until is not null)
            ) then
              raise exception 'checkout amount mismatch left an order or reservation';
            end if;
            if (select attempt_count from public.checkout_rate_limits where key_hash=repeat('f',64)) <> 1 then
              raise exception 'failed checkout did not retain its rate-limit attempt';
            end if;
          end $$;

          do $$
          declare
            v_listing record;
            v_index integer := 0;
          begin
            for v_listing in
              select l.id,
                     (priced.true_price + case when priced.true_price >= 5000000 then 35000 else 0 end)::bigint
                       as expected_amount
                from public.listings as l
                cross join lateral (
                  select case
                    when 'sale'=any(coalesce(l.tags,'{}'::text[]))
                     and l.sale_price is not null and l.sale_price > 0
                     and l.sale_price < trunc(coalesce(l.price,0))::bigint
                     and coalesce(l.sale_started_at,l.created_at) + interval '72 hours' > now()
                      then l.sale_price::bigint
                    else trunc(coalesce(l.price,0))::bigint
                  end as true_price
                ) as priced
               where l.status='on_sale' and l.sold_order_id is null
                 and (l.reserved_order_id is null or l.reserved_until <= now())
                 and priced.true_price > 0
               order by l.id limit 6
            loop
              v_index := v_index + 1;
              if v_index <= 5 then
                perform public.create_checkout_order_edge_v1(
                  p_rate_key => repeat('c',64),
                  p_customer_id => null,
                  p_listing_id => v_listing.id,
                  p_checkout_request_key_hash => lpad(v_index::text,64,'a'),
                  p_checkout_token_hash => lpad(v_index::text,64,'d'),
                  p_expected_amount => v_listing.expected_amount,
                  p_buyer_name => '검증 구매자',
                  p_buyer_phone => '01000000000',
                  p_ship_recipient => '검증 수령인',
                  p_ship_phone => '01000000000',
                  p_ship_postcode => '00000',
                  p_ship_addr1 => '검증 주소'
                );
              else
                begin
                  perform public.create_checkout_order_edge_v1(
                    p_rate_key => repeat('c',64),
                    p_customer_id => null,
                    p_listing_id => v_listing.id,
                    p_checkout_request_key_hash => repeat('6',64),
                    p_checkout_token_hash => repeat('e',64),
                    p_expected_amount => v_listing.expected_amount,
                    p_buyer_name => '검증 구매자',
                    p_buyer_phone => '01000000000',
                    p_ship_recipient => '검증 수령인',
                    p_ship_phone => '01000000000',
                    p_ship_postcode => '00000',
                    p_ship_addr1 => '검증 주소'
                  );
                  raise exception 'checkout rate limit did not block attempt 6';
                exception
                  when others then
                    if sqlerrm not like '%checkout_rate_limited%' then raise; end if;
                end;
              end if;
            end loop;
            if v_index < 6 then raise exception 'not enough listings for checkout rate test'; end if;
          end $$;
          -- Prove the generalized hash-only hold blocks every DB mutation
          -- without logging or persisting a raw order identifier.
          do $$
          declare
            v_order public.orders%rowtype;
          begin
            select * into strict v_order
              from public.orders
             where order_no=current_setting('app.guard_test_order_no');

            insert into public.payment_operation_holds(order_no_sha256, reason_code)
            values (public.payment_order_no_sha256_v1(v_order.order_no), 'rollback_fixture_order');

            if public.read_payment_operation_control_v1('unknown_control')
               or public.read_payment_operation_control_v1('payment_webhook') then
              raise exception 'payment operation controls are not fail-closed';
            end if;

            begin
              update public.orders set status=status where id=v_order.id;
              raise exception 'held order update was not blocked';
            exception when others then
              if sqlerrm not like '%payment_operation_held%' then raise; end if;
            end;

            begin
              update public.listings set status=status where id=v_order.listing_id;
              raise exception 'held listing update was not blocked';
            exception when others then
              if sqlerrm not like '%payment_operation_held%' then raise; end if;
            end;

            begin
              truncate public.orders cascade;
              raise exception 'held order truncate was not blocked';
            exception when others then
              if sqlerrm not like '%payment_operation_held%' then raise; end if;
            end;
          end $$;

          -- Force every deferred constraint trigger to execute inside the
          -- validation transaction. A plain rollback would otherwise skip
          -- transaction-end failures and could report a false pass.
          set constraints all immediate;
          rollback;
          SQL
          echo "분리된 검증 DB에서 스키마 컴파일·ACL·결제/환불 멱등 테스트 완료(전체 rollback)"

      - name: Cleanup — 일회성 Supabase 검증 DB
        if: always() && inputs.task == 'validate-authority-payment'
        run: |
          set -euo pipefail
          docker rm --force bellore-payment-validation-db >/dev/null 2>&1 || true
          if [ -n "${PAYMENT_VALIDATION_DIR:-}" ]; then
            validation_dir="$(realpath -m "$PAYMENT_VALIDATION_DIR")"
            runner_temp="$(realpath -m "$RUNNER_TEMP")"
            case "$validation_dir" in
              "$runner_temp"/payment-validation.*) rm -rf -- "$validation_dir" ;;
              *) echo "검증 임시 경로 삭제 거부: RUNNER_TEMP 밖"; exit 1 ;;
            esac
          fi
          echo "일회성 검증 DB 삭제 완료"

      - name: Apply authority and payment migration
        if: inputs.task == 'apply-authority-payment'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
          PAYMENT_HOLD_SHA256: ${{ inputs.payment_hold_sha256 }}
          PGCONNECT_TIMEOUT: "10"
          PGOPTIONS: "-c lock_timeout=5000 -c statement_timeout=300000 -c idle_in_transaction_session_timeout=360000"
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN -e PGCONNECT_TIMEOUT -e PGOPTIONS \
            -v "$PWD:/repo:ro" postgres:17 \
            psql "$PGCONN" -X -v ON_ERROR_STOP=1 \
              -v payment_hold_sha256="$PAYMENT_HOLD_SHA256" <<'SQL'
          begin;
          do $$
          begin
            if to_regclass('supabase_migrations.schema_migrations') is null then
              raise exception 'migration_ledger_missing';
            end if;
            if exists (
              select 1 from supabase_migrations.schema_migrations
               where version !~ '^[0-9]{14}$'
            ) then
              raise exception 'migration_ledger_noncanonical';
            end if;
            if (select count(*) from supabase_migrations.schema_migrations
                 where name='customer_shipping_addresses') <> 1 then
              raise exception 'shipping_migration_ledger_baseline_mismatch';
            end if;
            if exists (
              select 1 from supabase_migrations.schema_migrations
               where version in (
                 '20260826155000','20260826160000','20260826170000','20260826180000','20260826190000'
               )
            ) then
              raise exception 'payment_release_migration_already_recorded';
            end if;
            if exists (
              select 1 from supabase_migrations.schema_migrations
               where version >= '20260826155000'
            ) then
              raise exception 'migration_ledger_ahead_of_release';
            end if;

            -- Historical authority hardening exists in production without the
            -- repository filename as a ledger version. Do not counterfeit that
            -- history. Prove the exact data-free schema/ACL fingerprint instead.
            if to_regclass('public.orders') is null
               or to_regclass('public.listings') is null
               or to_regclass('public.checkout_rate_limits') is null
               or to_regclass('public.shipping_addresses') is null then
              raise exception 'authority_payment_schema_baseline_missing';
            end if;
            if exists (
              select 1
                from (values
                  ('orders','id','uuid'),
                  ('orders','order_no','text'),
                  ('orders','customer_id','uuid'),
                  ('orders','listing_id','uuid'),
                  ('orders','amount','int8'),
                  ('orders','discount','int8'),
                  ('orders','product_price','int8'),
                  ('orders','status','text'),
                  ('orders','checkout_token_hash','text'),
                  ('orders','provider_transaction_id','text'),
                  ('orders','refund_amount','int8'),
                  ('listings','id','uuid'),
                  ('listings','status','text'),
                  ('listings','reserved_order_id','uuid'),
                  ('listings','reserved_until','timestamptz'),
                  ('listings','sold_order_id','uuid'),
                  ('listings','price','numeric'),
                  ('checkout_rate_limits','key_hash','text'),
                  ('checkout_rate_limits','attempt_count','int4'),
                  ('checkout_rate_limits','window_started_at','timestamptz'),
                  ('shipping_addresses','id','uuid'),
                  ('shipping_addresses','user_id','uuid'),
                  ('shipping_addresses','is_default','bool')
                ) as expected(table_name,column_name,udt_name)
                left join information_schema.columns as actual
                  on actual.table_schema='public'
                 and actual.table_name=expected.table_name
                 and actual.column_name=expected.column_name
                 and actual.udt_name=expected.udt_name
               where actual.column_name is null
            ) then
              raise exception 'authority_payment_column_fingerprint_mismatch';
            end if;
            if to_regprocedure('public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)') is null
               or to_regprocedure('public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)') is null
               or to_regprocedure('public.consume_checkout_rate_limit(text)') is null
               or to_regprocedure('public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)') is null
               or to_regprocedure('public.finalize_order_refund_v2(text,bigint,text,text)') is null
               or to_regprocedure('public.mark_order_payment_review(text,text)') is null
               or to_regprocedure('public.mark_order_refund_pending(text,text)') is null
               or to_regprocedure('public.fail_unsettled_order(text,text)') is null
               or to_regprocedure('public.release_expired_checkout_reservations()') is null
               or to_regprocedure('public.order_request_cancel(text,text)') is null then
              raise exception 'authority_payment_rpc_fingerprint_mismatch';
            end if;
            if not exists (
              select 1 from pg_trigger
               where tgrelid='public.orders'::regclass
                 and tgname='trg_guard_order_money_fields'
                 and tgfoid=to_regprocedure('public.guard_order_money_fields()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or not exists (
              select 1 from pg_trigger
               where tgrelid='public.shipping_addresses'::regclass
                 and tgname='trg_guard_customer_shipping_address'
                 and tgfoid=to_regprocedure('public.guard_customer_shipping_address()')
                 and tgenabled <> 'D' and not tgisinternal
            ) or not exists (
              select 1 from pg_class as c
               join pg_namespace as n on n.oid=c.relnamespace
               where n.nspname='public' and c.relname='orders'
                 and c.relrowsecurity
            ) or not exists (
              select 1 from pg_class as c
               join pg_namespace as n on n.oid=c.relnamespace
               where n.nspname='public' and c.relname='checkout_rate_limits'
                 and c.relrowsecurity
            ) or not exists (
              select 1 from pg_class as c
               join pg_namespace as n on n.oid=c.relnamespace
               where n.nspname='public' and c.relname='shipping_addresses'
                 and c.relrowsecurity
            ) or (select count(*) from pg_policies
                    where schemaname='public' and tablename='shipping_addresses'
                      and policyname in (
                        'shipping_addresses_select_own','shipping_addresses_insert_own',
                        'shipping_addresses_update_own','shipping_addresses_delete_own'
                      )) <> 4 then
              raise exception 'authority_payment_trigger_or_rls_fingerprint_mismatch';
            end if;
            if not exists (
              select 1 from pg_proc as p
               where p.oid='public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure
                 and p.prosecdef
                 and 'search_path=""'=any(coalesce(p.proconfig,'{}'::text[]))
            ) or not exists (
              select 1 from pg_proc as p
               where p.oid='public.consume_checkout_rate_limit(text)'::regprocedure
                 and p.prosecdef
                 and 'search_path=""'=any(coalesce(p.proconfig,'{}'::text[]))
            ) then
              raise exception 'authority_payment_function_security_fingerprint_mismatch';
            end if;
            if position('for update' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('v_listing.status <> ''on_sale''' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('v_true_price' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('5000000' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('v_coupon.user_id <> v_uid' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('insert into public.orders' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('update public.listings' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0
               or position('reserved_order_id = v_order.id' in lower(pg_get_functiondef(
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)'::regprocedure)))=0 then
              raise exception 'checkout_core_body_fingerprint_mismatch';
