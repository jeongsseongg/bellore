               or to_regprocedure('public.guard_new_checkout_claims_v1()') is not null
               or to_regprocedure('public.guard_listing_reservation_owner_v1()') is not null
               or to_regprocedure('public.order_requires_restock_v1(uuid,smallint,text,boolean,timestamptz,timestamptz,timestamptz)') is not null
               or to_regprocedure('public.clear_confirmed_payment_review_v1(text,text,bigint)') is not null
               or to_regprocedure('public.recover_checkout_order_edge_v1(text,text,uuid)') is not null
               or exists (
                 select 1 from information_schema.columns
                  where table_schema='public' and table_name='orders'
                    and column_name in (
                      'payment_contract_version','checkout_request_key_hash',
                      'payment_terminal_at','restock_required','payment_review_required',
                      'refund_intent_code'
                    )
               ) or exists (
                 select 1 from pg_constraint
                  where conname in (
                    'orders_v2_terminal_timestamp_required',
                    'orders_refund_intent_code_allowed',
                    'orders_payment_contract_version_allowed',
                    'orders_checkout_request_key_hash_format'
                  )
               ) or exists (
                 select 1 from pg_trigger
                  where not tgisinternal and tgname in (
                    'trg_00_payment_operation_hold_order',
                    'trg_00_payment_operation_hold_listing',
                    'trg_00_payment_operation_hold_orders_truncate',
                    'trg_00_payment_operation_hold_listings_truncate',
                    'trg_stamp_order_payment_terminal_at_v1',
                    'trg_sync_listing_state_from_order_v1',
                    'trg_guard_new_checkout_claims_v1',
                    'trg_guard_listing_reservation_owner_v1'
                  )
               ) then
              raise exception 'payment_release_partial_schema_detected';
            end if;
          end $$;

          \i /repo/supabase/migrations/20260826155000_payment_operation_hold.sql

          insert into public.payment_operation_holds(order_no_sha256, reason_code)
          values (:'payment_hold_sha256', 'release_protection')
          on conflict (order_no_sha256) do update
            set released_at=null,
                release_note=null,
                reason_code=excluded.reason_code;

          select (count(*)=1) as payment_hold_seed_ok
            from public.payment_operation_holds
           where order_no_sha256=:'payment_hold_sha256'
             and released_at is null \gset
          \if :payment_hold_seed_ok
            \echo 'hash-only payment operation hold verified'
          \else
            \echo 'payment operation hold seed failed'
            \quit 1
          \endif

          \i /repo/supabase/migrations/20260826160000_payment_recovery_listing_state.sql
          \i /repo/supabase/migrations/20260826170000_checkout_claim_integrity.sql
          \i /repo/supabase/migrations/20260826180000_order_financial_state_guard.sql
          \i /repo/supabase/migrations/20260826190000_payment_finalization_closed_order_contract.sql

          insert into supabase_migrations.schema_migrations(version,name,statements)
          values
            ('20260826155000','payment_operation_hold',array[]::text[]),
            ('20260826160000','payment_recovery_listing_state',array[]::text[]),
            ('20260826170000','checkout_claim_integrity',array[]::text[]),
            ('20260826180000','order_financial_state_guard',array[]::text[]),
            ('20260826190000','payment_finalization_closed_order_contract',array[]::text[]);

          set constraints all immediate;
          commit;
          SQL
          echo "권한·결제·복구·체크아웃 귀속·금융상태 가드 마이그레이션 적용 완료"

      - name: Verify hash-only hold without reading the protected order
        if: inputs.task == 'apply-authority-payment'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
          PAYMENT_HOLD_SHA256: ${{ inputs.payment_hold_sha256 }}
        run: |
          set -euo pipefail
          hold_count="$(docker run --rm -i -e PGCONN postgres:17 \
            psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
              -v payment_hold_sha256="$PAYMENT_HOLD_SHA256" <<'SQL'
          select count(*)
            from public.payment_operation_holds
           where order_no_sha256=:'payment_hold_sha256'
             and released_at is null;
          SQL
          )"
          if [ "$hold_count" != "1" ]; then
            echo "Exact hash-only hold verification failed"; exit 1
          fi
          echo "Exact hash-only hold is active; protected order was not queried"

      - name: Verify live authority and payment ACL
        if: inputs.task == 'apply-authority-payment' || inputs.task == 'verify-authority-payment-live'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.payment_operation_controls') is null
               or to_regclass('public.payment_operation_holds') is null
               or to_regclass('public.payment_reconciliation_orders_edge_v1') is null
