name: DB Maintenance

# Supabase DB에 대한 점검/마이그레이션을 GitHub에서 직접 실행한다.
# (db-backup.yml 과 동일한 SUPABASE_DB_URL 시크릿 사용 — 추가 설정 불필요)
#
# 실행 방법: Actions 탭 > DB Maintenance > Run workflow
#   task = diagnose            : 읽기 전용 점검(테이블 상태·최근 데이터 요약)
#   task = apply-discord-quote : discord_quote*.sql 3개를 순서대로 적용(재실행 안전)
#
# 개인정보(이메일/전화)는 로그에 출력하지 않는다.

on:
  schedule:
    - cron: '20 18 * * *' # 매일 03:20 KST, pg_cron 미설치 프로젝트의 보존정책 실행
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        type: choice
        default: diagnose
        options:
          - diagnose
          - apply-discord-quote
          - apply-admin-multi-bids
          - apply-quote-followup
          - apply-analytics-v3
          - validate-authority-payment
          - apply-authority-payment
          - verify-authority-payment-live
          - purge-analytics-v3
      confirm_sha:
        description: "DB apply 때만: 이 workflow가 실행할 정확한 커밋 SHA"
        type: string
        required: false
      backup_run_id:
        description: "DB apply 때만: 24시간 이내 성공한 db-backup run ID"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  truth_guard:
    uses: ./.github/workflows/truth-guard.yml

  run:
    if: github.ref == 'refs/heads/main'
    needs: truth_guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard — 시크릿 없으면 중단
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL 시크릿 미설정 — 실행 불가"; exit 1
          fi

      - name: Guard authority apply — exact SHA and recoverable backup
        if: inputs.task == 'apply-authority-payment'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.confirm_sha }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "confirm_sha must exactly match GITHUB_SHA"; exit 1
          fi
          if ! [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "backup_run_id is required"; exit 1
          fi
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID")
          echo "$run_json" | jq -e \
            '(.conclusion == "success") and (.head_branch == "main") and
             ((.path == ".github/workflows/db-backup.yml") or
              (.path | startswith(".github/workflows/db-backup.yml@"))) and
             ((now - (.created_at | fromdateiso8601)) < 86400)' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "db-backup" and .expired == false and .size_in_bytes > 1024)] | length' \
            | grep -qx '1'
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_PASSPHRASE is required to prove the artifact is recoverable"; exit 1
          fi
          umask 077
          backup_dir="$(mktemp -d)"
          trap 'rm -rf "$backup_dir"' EXIT
          gh run download "$BACKUP_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name db-backup --dir "$backup_dir"
          mapfile -d '' backup_files < <(
            find "$backup_dir" -type f -name 'bellore-*.sql.gz.gpg' -print0
          )
          if [ "${#backup_files[@]}" -ne 1 ]; then
            echo "Expected exactly one encrypted SQL dump"; exit 1
          fi
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --output "$backup_dir/backup.sql.gz" --decrypt "${backup_files[0]}"
          gzip -t "$backup_dir/backup.sql.gz"
          gzip -cd "$backup_dir/backup.sql.gz" > "$backup_dir/backup.sql"
          grep -Eq '^-- PostgreSQL database dump|^CREATE (SCHEMA|TABLE)|^COPY ' \
            "$backup_dir/backup.sql"
          echo "Exact release SHA and decryptable, decompressible SQL backup verified"

      - name: Apply discord_quote SQL (재실행 안전)
        if: inputs.task == 'apply-discord-quote'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for f in discord_quote.sql discord_quote_v2.sql discord_quote_v3.sql; do
            echo "=== $f ==="
            docker run --rm -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f "/repo/$f"
          done
          echo "모든 SQL 적용 완료"

      - name: Apply admin multi-bids SQL (재실행 안전)
        if: inputs.task == 'apply-admin-multi-bids'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for f in admin_multi_bids.sql bid_notify.sql; do
            echo "=== $f ==="
            docker run --rm -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f "/repo/$f"
          done

          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            fn text;
          begin
            select pg_get_functiondef('public.notify_customer_on_bid()'::regprocedure) into fn;
            if position('not found or customer_id is null' in fn) = 0
               or position('when others' in fn) = 0 then
              raise exception 'notify_customer_on_bid verification failed';
            end if;
            if not exists (
              select 1
                from pg_trigger
               where tgrelid = 'public.bids'::regclass
                 and tgname = 'trg_notify_customer_on_bid'
                 and not tgisinternal
            ) then
              raise exception 'trg_notify_customer_on_bid verification failed';
            end if;
          end $$;
          SQL
          echo "관리자 중복견적·고객 알림 DB 적용 및 검증 완료"

      - name: Apply quote followup SQL (재실행 안전)
        if: inputs.task == 'apply-quote-followup'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
            psql "$PGCONN" -v ON_ERROR_STOP=1 -f "/repo/quote_followup.sql"
          echo "판매 확정 후속처리 DB 적용 완료"

      - name: Apply analytics V3 canonical SQL
        if: inputs.task == 'apply-analytics-v3'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
            psql "$PGCONN" -v ON_ERROR_STOP=1 -f "/repo/analytics_v3_canonical.sql"
          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          select site_id, enabled, raw_event_retention_days, aggregate_retention_days, click_id_retention_days
            from public.analytics_settings where site_id='bellore';
          select to_regprocedure('public.analytics_ingest_event(jsonb,text,uuid)') is null as legacy_ingest_removed,
                 has_function_privilege('anon','public.analytics_ingest_event(jsonb,text,uuid,text,text)','execute') as anon_can_ingest,
                 has_function_privilege('service_role','public.analytics_ingest_event(jsonb,text,uuid,text,text)','execute') as service_can_ingest;
          SQL
          echo "분석 V3 스키마 적용 완료 — 원시/클릭 ID 90일, 비식별 집계 730일"

      - name: Validate authority and payment migration (always rollback)
        if: inputs.task == 'validate-authority-payment' || inputs.task == 'apply-authority-payment'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
            psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          \i /repo/supabase/migrations/20260824090000_authority_payment_hardening.sql

          do $$
          begin
            if has_table_privilege('anon','public.orders','insert')
               or has_table_privilege('authenticated','public.orders','insert') then
              raise exception 'orders direct insert is still open';
            end if;
            if has_function_privilege('anon','public._claim_coupon(public.coupons,uuid)','execute')
               or has_function_privilege('authenticated','public._claim_coupon(public.coupons,uuid)','execute') then
              raise exception 'internal coupon helper is still public';
            end if;
            if has_function_privilege('anon',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('authenticated',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('anon',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('authenticated',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('anon',
              'public.consume_checkout_rate_limit(text)','execute')
               or has_function_privilege('authenticated',
              'public.consume_checkout_rate_limit(text)','execute') then
              raise exception 'browser role bypasses checkout Edge gate';
            end if;
            if not has_function_privilege('service_role',
              'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or not has_function_privilege('service_role',
              'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute') then
              raise exception 'checkout RPC is not executable by service role';
            end if;
            if not has_function_privilege('service_role',
              'public.consume_checkout_rate_limit(text)','execute') then
              raise exception 'checkout rate limiter is not executable by service role';
            end if;
            if has_function_privilege('authenticated',
              'public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)','execute') then
              raise exception 'payment finalizer leaked to browser role';
            end if;
            if not exists (
              select 1 from pg_policies
               where schemaname='storage' and tablename='objects'
                 and policyname='photos_auth_delete'
                 and qual like '%owner_id%'
            ) then
              raise exception 'storage ownership policy missing';
            end if;
          end $$;

          select id as listing_id
            from public.listings
           where status='on_sale'
           order by id limit 1 \gset
          set local role service_role;
          set local request.jwt.claims = '{"role":"service_role"}';
          select public.create_checkout_order_edge_v1(
            repeat('a',64), null, :'listing_id'::uuid, repeat('b',64)
          );
          select order_no, amount
            from public.orders
           where checkout_token_hash=repeat('b',64)
           order by created_at desc limit 1 \gset
          select public.finalize_paid_order_v2(
            :'order_no', :'amount'::bigint, 'CARD', :'order_no', 'dry-run-tx', null, null, 0
          );
          select public.finalize_paid_order_v2(
            :'order_no', :'amount'::bigint, 'CARD', :'order_no', 'dry-run-tx', null, null, 0
          );
          update public.orders set status='returning' where order_no=:'order_no';
          select public.finalize_order_refund_v2(
            :'order_no', :'amount'::bigint, 'dry-run', 'dry-run-cancel'
          );
          select public.finalize_order_refund_v2(
            :'order_no', :'amount'::bigint, 'dry-run', 'dry-run-cancel'
          );
          reset role;

          select exists (
            select 1 from public.orders
             where order_no=:'order_no' and status='refunded'
               and refund_amount=:'amount'::bigint
          ) and exists (
            select 1 from public.listings
             where id=:'listing_id'::uuid and status='on_sale'
               and sold_order_id is null
          ) as lifecycle_ok \gset
          \if :lifecycle_ok
            \echo 'payment/refund/listing lifecycle verified'
          \else
            \echo 'payment/refund/listing lifecycle verification failed'
            \quit 1
          \endif

          do $$
          declare
            v_listing uuid;
            v_index integer := 0;
          begin
            for v_listing in
              select id from public.listings where status='on_sale' order by id limit 6
            loop
              v_index := v_index + 1;
              if v_index <= 5 then
                perform public.create_checkout_order_edge_v1(
                  repeat('c',64), null, v_listing,
                  lpad(v_index::text,64,'d')
                );
              else
                begin
                  perform public.create_checkout_order_edge_v1(
                    repeat('c',64), null, v_listing, repeat('e',64)
                  );
                  raise exception 'checkout rate limit did not block attempt 6';
                exception
                  when others then
                    if sqlerrm not like '%checkout_rate_limited%' then raise; end if;
                end;
              end if;
            end loop;
            if v_index < 6 then raise exception 'not enough listings for checkout rate test'; end if;
          end $$;
          rollback;
          SQL
          echo "운영 스키마 컴파일·ACL·결제/환불 멱등 테스트 완료(전체 rollback)"

      - name: Apply authority and payment migration
        if: inputs.task == 'apply-authority-payment'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e PGCONN -v "$PWD:/repo:ro" postgres:17 \
            psql "$PGCONN" -v ON_ERROR_STOP=1 --single-transaction \
              -f /repo/supabase/migrations/20260824090000_authority_payment_hardening.sql
          echo "권한·결제 마이그레이션 적용 완료"

      - name: Verify live authority and payment ACL
        if: inputs.task == 'apply-authority-payment' || inputs.task == 'verify-authority-payment-live'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if has_table_privilege('anon','public.orders','insert')
               or has_table_privilege('authenticated','public.orders','insert')
               or has_function_privilege('anon','public._claim_coupon(public.coupons,uuid)','execute')
               or to_regprocedure('public.finalize_paid_order_v2(text,bigint,text,text,text,text,jsonb,integer)') is null
               or to_regprocedure('public.finalize_order_refund_v2(text,bigint,text,text)') is null
               or has_function_privilege('anon',
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('authenticated',
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or has_function_privilege('anon',
                 'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('authenticated',
                 'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or has_function_privilege('anon',
                 'public.consume_checkout_rate_limit(text)','execute')
               or has_function_privilege('authenticated',
                 'public.consume_checkout_rate_limit(text)','execute')
               or not has_function_privilege('service_role',
                 'public.create_checkout_order(uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb,uuid)','execute')
               or not has_function_privilege('service_role',
                 'public.create_checkout_order_edge_v1(text,uuid,uuid,text,uuid,text,text,text,text,text,text,text,text,jsonb)','execute')
               or not has_function_privilege('service_role',
                 'public.consume_checkout_rate_limit(text)','execute')
               or (select count(*) from pg_policies
                    where schemaname='storage' and tablename='objects'
                      and policyname in ('photos_auth_insert','photos_auth_update','photos_auth_delete')) <> 3 then
              raise exception 'authority/payment post-apply verification failed';
            end if;
          end $$;
          SQL
          echo "운영 권한·결제 ACL 사후 검증 완료"

      - name: Verify checkout rate limit across concurrent DB sessions
        if: inputs.task == 'apply-authority-payment' || inputs.task == 'verify-authority-payment-live'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RATE_KEY="$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -d' ' -f1)"
          result_dir="$(mktemp -d)"
          cleanup_rate() {
            docker run --rm -e PGCONN postgres:17 \
              psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
              -c "delete from public.checkout_rate_limits where key_hash='$RATE_KEY'" \
              >/dev/null
            rm -rf "$result_dir"
          }
          trap cleanup_rate EXIT

          pids=()
          for attempt in $(seq 1 10); do
            (
              if docker run --rm -e PGCONN \
                postgres:17 psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
                -c "set role service_role; set request.jwt.claims = '{\"role\":\"service_role\"}'; select public.consume_checkout_rate_limit('$RATE_KEY')" \
                >"$result_dir/$attempt.out" 2>"$result_dir/$attempt.err"; then
                : >"$result_dir/$attempt.ok"
              elif grep -q 'checkout_rate_limited' "$result_dir/$attempt.err"; then
                : >"$result_dir/$attempt.limited"
              else
                : >"$result_dir/$attempt.unexpected"
              fi
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

          success_count="$(find "$result_dir" -name '*.ok' -type f | wc -l | tr -d ' ')"
          limited_count="$(find "$result_dir" -name '*.limited' -type f | wc -l | tr -d ' ')"
          unexpected_count="$(find "$result_dir" -name '*.unexpected' -type f | wc -l | tr -d ' ')"
          if [ "$success_count" != 5 ] || [ "$limited_count" != 5 ] || [ "$unexpected_count" != 0 ]; then
            echo "Concurrent rate test failed: allowed=$success_count limited=$limited_count unexpected=$unexpected_count"
            for marker in "$result_dir"/*.unexpected; do
              [ -e "$marker" ] || continue
              err_file="${marker%.unexpected}.err"
              if grep -q 'checkout_rate_forbidden' "$err_file"; then
                echo "unexpected category: role-claim"
              elif grep -qi 'permission denied' "$err_file"; then
                echo "unexpected category: permission"
              elif grep -qi 'too many clients\|remaining connection slots' "$err_file"; then
                echo "unexpected category: connection-limit"
              elif grep -qi 'could not connect\|connection refused\|timeout' "$err_file"; then
                echo "unexpected category: connection"
              else
                echo "unexpected category: other"
              fi
            done | sort | uniq -c
            exit 1
          fi
          stored_count="$(docker run --rm -e PGCONN postgres:17 \
            psql "$PGCONN" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select attempt_count from public.checkout_rate_limits where key_hash='$RATE_KEY'")"
          test "$stored_count" = 5
          echo "Concurrent checkout rate limit verified: allowed=5 limited=5 stored=5"

      - name: Purge expired analytics data
        if: github.event_name == 'schedule' || inputs.task == 'purge-analytics-v3'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          select public.analytics_purge_expired();
          SQL
          echo "분석 데이터 보존정책 실행 완료"

      - name: Diagnose (읽기 전용)
        if: inputs.task == 'diagnose'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e PGCONN postgres:17 psql "$PGCONN" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '=== quote_requests.customer_id NULL 허용 여부 (is_nullable=YES 여야 함) ==='
          select column_name, is_nullable from information_schema.columns
           where table_schema='public' and table_name='quote_requests'
             and column_name in ('customer_id','source_channel_id','item_ref');
          \echo '=== team_messages 수집 현황 ==='
          select count(*) as total,
                 max(created_at) as last_collected
            from public.team_messages;
          \echo '=== team_messages 최근 5건 (내용 40자까지만) ==='
          select created_at, platform, channel_name, has_attachment,
                 left(coalesce(message,''), 40) as message_head
            from public.team_messages order by created_at desc limit 5;
          \echo '=== quote_requests 최근 5건 ==='
          select created_at, status,
                 (customer_id is null) as guest,
                 left(coalesce(item_name,''), 30) as item
            from public.quote_requests order by created_at desc limit 5;
          SQL

      - name: Diagnose 정책 확인
        if: inputs.task == 'diagnose'
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e PGCONN postgres:17 psql "$PGCONN" -c \
            "select policyname, tablename from pg_policies where policyname in ('photos_discord_bot_insert','quote_requests_open_read');"
