<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>로그인 | 벨로르</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app/features/auth-login/auth-login.css?v=20260826-auth-page-v2">
  <link rel="stylesheet" href="app/features/auth-signup/auth-signup.css?v=20260827-auth-signup-v1">
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell" id="authShell" aria-labelledby="authTitle">
      <a class="auth-close" href="/" aria-label="홈으로 돌아가기">×</a>
      <a class="auth-logo" href="/" aria-label="벨로르 홈">
        <img src="assets/logo-bellore.png" alt="BELLORE">
      </a>
      <h1 id="authTitle" class="sr-only">벨로르 로그인</h1>
      <form class="auth-form" id="authEmailForm">
        <label class="auth-field">
          <input type="text" name="id" id="authLoginId" placeholder="아이디 또는 이메일" autocomplete="username" required>
          <button type="button" class="auth-remember" id="authRemember" aria-label="아이디 기억하기" aria-pressed="false">✓</button>
        </label>
        <label class="auth-field">
          <input type="password" name="password" id="authLoginPassword" placeholder="비밀번호" autocomplete="current-password" required>
          <button type="button" class="auth-eye" id="authPasswordToggle" aria-label="비밀번호 표시">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/><path d="m4 20 16-16"/></svg>
          </button>
        </label>
        <button class="auth-submit" type="submit">로그인하기</button>
      </form>
      <nav class="auth-links" aria-label="계정 도움말">
        <a href="/login.html?view=signup">회원가입</a><i></i>
        <a href="/login.html?view=find-id">아이디 찾기</a><i></i>
        <a href="/login.html?view=find-password">비밀번호 찾기</a>
      </nav>
      <div class="auth-divider" aria-hidden="true"></div>
      <div class="auth-socials">
        <button class="auth-social auth-social--naver" type="button" data-provider="naver">
          <span class="auth-mark auth-mark--naver" aria-hidden="true">N</span>
          <span>네이버 로그인 준비 중</span>
        </button>
        <button class="auth-social auth-social--kakao" type="button" data-provider="kakao">
          <span class="auth-mark auth-mark--kakao" aria-hidden="true"></span>
          <span>카카오로 계속하기</span>
        </button>
        <button class="auth-social auth-social--google" type="button" data-provider="google">
          <svg class="auth-mark auth-mark--google" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Google로 계속하기</span>
        </button>
      </div>
      <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
    </section>
    <section class="signup-shell" id="signupShell" aria-labelledby="signupTitle" hidden>
      <a class="signup-back" href="/login.html" aria-label="로그인으로 돌아가기">‹</a>
      <a class="signup-logo" href="/" aria-label="벨로르 홈"><img src="assets/logo-bellore.png" alt="BELLORE"></a>
      <header class="signup-heading"><p id="signupProgress">1 / 2</p><h1 id="signupTitle">회원 정보를<br>입력해 주세요.</h1></header>
      <form id="signupForm" class="signup-form" novalidate>
        <section id="signupStep1" class="signup-step">
          <fieldset class="role-choice"><legend>회원 유형</legend>
            <label><input type="radio" name="role" value="customer" checked><span><b>일반 회원</b><small>구매·비교견적 신청</small></span></label>
            <label><input type="radio" name="role" value="vendor"><span><b>업체 회원</b><small>비교견적 신청·입찰 참여</small></span></label>
          </fieldset>
          <label class="field"><span>이름</span><input type="text" name="name" id="suName" autocomplete="name" required></label>
          <div class="field"><span>아이디</span><div class="field-action"><input type="text" name="username" id="suUsername" autocomplete="username" minlength="4" placeholder="영문·숫자·밑줄 4자 이상" required><button type="button" id="suIdCheck">중복확인</button></div><small id="suIdHelp" aria-live="polite"></small></div>
          <label class="field"><span>비밀번호</span><input type="password" name="pw" id="suPw" autocomplete="new-password" minlength="8" placeholder="8자 이상" required></label>
          <label class="field"><span>비밀번호 확인</span><input type="password" name="pw2" id="suPw2" autocomplete="new-password" minlength="8" required><small id="suPw2Help" aria-live="polite"></small></label>
          <label class="field"><span>이메일</span><input type="email" name="email" id="suEmail" autocomplete="email" placeholder="email@example.com" required></label>
          <div class="field"><span>주소</span><div class="field-action"><input type="text" name="postcode" id="signupPostcode" placeholder="우편번호" readonly required><button type="button" id="signupFindAddr">주소 찾기</button></div><input type="text" name="addr1" id="signupAddr1" placeholder="기본 주소" readonly required><input type="text" name="addr2" id="signupAddr2" placeholder="상세 주소"></div>
          <label class="check"><input type="checkbox" id="signupAgree"><span>이용약관과 개인정보처리방침에 동의합니다. (필수)</span></label>
          <label class="check"><input type="checkbox" id="signupAdConsent"><span>혜택·이벤트 알림 수신에 동의합니다. (선택)</span></label>
          <button type="button" class="primary" id="signupNext">다음</button>
        </section>
        <section id="signupStep2" class="signup-step" hidden>
          <p class="step-guide" id="signupStep2Hint">이메일 인증 후 휴대폰 본인인증을 진행해 주세요.</p>
          <div class="verification" data-v="email"><div class="verification-title"><b>이메일 인증</b><span>필수</span></div><p>입력한 이메일로 받은 인증번호를 확인합니다.</p>
            <div class="verification-action"><strong id="suEmailVerifyValue">이메일을 확인해 주세요.</strong><button type="button" data-vsend="email">인증번호 받기</button></div>
            <div class="verification-code vrow-code" hidden><input type="text" id="suEmailCode" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="10" placeholder="메일로 받은 인증번호"><button type="button" data-vconfirm="email">확인</button></div><small class="vrow-state" data-vstate="email" aria-live="polite"></small>
          </div>
          <div class="verification" data-v="phone"><div class="verification-title"><b>휴대폰 명의 확인</b><span>필수</span></div><p>KG이니시스 간편인증 결과를 서버에서 다시 확인합니다.</p>
            <div class="verification-action"><input type="tel" name="phone" id="suPhone" placeholder="010-0000-0000"><button type="button" data-vsend="phone">본인인증</button></div><small class="vrow-state" data-vstate="phone" aria-live="polite"></small>
          </div>
          <div id="suBizBlock" hidden>
            <div class="verification verification-fields" data-v="biz"><div class="verification-title"><b>사업자 진위확인</b><span>업체 필수</span></div><p>국세청 등록정보와 일치하는지 확인합니다.</p>
              <input type="text" name="company" id="suCompany" placeholder="상호"><input type="text" name="businessNo" id="suBizNo" inputmode="numeric" placeholder="사업자등록번호 10자리"><input type="text" name="ceoName" id="suCeo" placeholder="대표자명"><input type="text" name="bizOpenDate" id="suBizOpen" inputmode="numeric" placeholder="개업일 8자리"><button type="button" data-vsend="biz">사업자 인증</button><small class="vrow-state" data-vstate="biz" aria-live="polite"></small>
            </div>
            <div class="verification verification-fields" data-v="account"><div class="verification-title"><b>계좌 실명확인</b><span>업체 필수</span></div><p>금융결제원 연동이 활성화되면 예금주와 계좌 명의를 확인합니다.</p>
              <input type="text" name="bank" id="suBank" placeholder="은행명"><input type="text" name="account" id="suAccount" inputmode="numeric" placeholder="계좌번호"><input type="text" name="holder" id="suHolder" placeholder="예금주"><button type="button" data-vsend="account">계좌 인증</button><small class="vrow-state" data-vstate="account" aria-live="polite"></small>
            </div>
          </div>
          <div class="step-actions"><button type="button" class="secondary" id="signupPrev">이전</button><button type="submit" class="primary" id="signupSubmitBtn">가입 완료</button></div>
        </section>
        <p class="signup-status" id="signupStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="supabase-config.js?v=20260826-payment-live-v1"></script>
  <script src="supabase.js?v=20260826-member-verification-live-v2"></script>
  <script type="module" src="app/features/auth-login/auth-login.js?v=20260826-auth-page-v2"></script>
  <script type="module" src="app/features/auth-signup/auth-signup.js?v=20260827-signup-history-v1"></script>
</body>
</html>
