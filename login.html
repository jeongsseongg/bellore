<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>로그인 | 벨로르</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="app/features/auth-login/auth-login.css?v=20260826-auth-page-v2">
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell" aria-labelledby="authTitle">
      <a class="auth-close" href="/" aria-label="홈으로 돌아가기">×</a>
      <a class="auth-logo" href="/" aria-label="벨로르 홈">
        <img src="assets/logo-bellore.png" alt="BELLORE">
      </a>
      <h1 id="authTitle" class="sr-only">벨로르 로그인</h1>
      <form class="auth-form" id="authEmailForm">
        <label class="auth-field">
          <input type="text" name="id" id="authLoginId" placeholder="아이디 또는 이메일" autocomplete="username" required>
          <button type="button" class="auth-remember" id="authRemember" aria-label="아이디 기억하기" aria-pressed="false">✓</button>
        </label>
        <label class="auth-field">
          <input type="password" name="password" id="authLoginPassword" placeholder="비밀번호" autocomplete="current-password" required>
          <button type="button" class="auth-eye" id="authPasswordToggle" aria-label="비밀번호 표시">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/><path d="m4 20 16-16"/></svg>
          </button>
        </label>
        <button class="auth-submit" type="submit">로그인하기</button>
      </form>
      <nav class="auth-links" aria-label="계정 도움말">
        <a href="/signup.html">회원가입</a><i></i>
        <a href="/login.html?view=find-id">아이디 찾기</a><i></i>
        <a href="/login.html?view=find-password">비밀번호 찾기</a>
      </nav>
      <div class="auth-divider" aria-hidden="true"></div>
      <div class="auth-socials">
        <button class="auth-social auth-social--naver" type="button" data-provider="naver">
          <span class="auth-mark auth-mark--naver" aria-hidden="true">N</span>
          <span>네이버로 시작하기</span>
        </button>
        <button class="auth-social auth-social--kakao" type="button" data-provider="kakao">
          <span class="auth-mark auth-mark--kakao" aria-hidden="true"></span>
          <span>카카오로 계속하기</span>
        </button>
        <button class="auth-social auth-social--google" type="button" data-provider="google">
          <svg class="auth-mark auth-mark--google" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Google로 계속하기</span>
        </button>
      </div>
      <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260826-payment-live-v1"></script>
  <script src="supabase.js?v=20260826-member-verification-live-v2"></script>
  <script type="module" src="app/features/auth-login/auth-login.js?v=20260826-auth-page-v2"></script>
</body>
</html>
